permissions:
  contents: read
  pages: write
  id-token: write

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # Typecheck before building, and fail the deploy if it does not pass.
      #
      # vite build strips types without checking them, so this repo has been shipping
      # whatever compiled. SEARCH_FIELDS in constants.ts is a list of field-name strings
      # indexed dynamically, and the directory's records are about to be renamed, so a
      # mistake here is silent: search simply stops matching on a field and nobody is told.
      # This is the only guard this repo has.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
